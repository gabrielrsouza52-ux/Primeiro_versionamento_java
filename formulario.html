<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetFicha — Cadastro de pets</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background-color: #eaf5ee;
            color: #243b2e;
        }

        main {
            max-width: 480px;
            margin: auto;
        }

        form, #ficha {
            background-color: white;
            padding: 24px;
            border-radius: 16px;
        }

        .campo {
            margin-bottom: 16px;
        }

        .campo > label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #a7bcae;
            border-radius: 8px;
            font: inherit;
        }

        textarea {
            resize: vertical;
        }

        fieldset {
            border: 1px solid #a7bcae;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #286443;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background-color: #1c4c31;
        }

        #ficha {
            margin-top: 20px;
            overflow-wrap: anywhere;
        }

        #ficha p {
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <main>
        <h1>PetFicha</h1>
        <p>Preencha os dados para cadastrar seu pet.</p>

        <form id="formulario">
            <div class="campo">
                <label for="nome">Nome do pet</label>
                <input type="text" id="nome" required>
            </div>

            <div class="campo">
                <label for="especie">Espécie</label>
                <select id="especie" required>
                    <option value="">Selecione</option>
                    <option value="Cachorro">Cachorro</option>
                    <option value="Gato">Gato</option>
                    <option value="Ave">Ave</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            <div class="campo">
                <label for="raca">Raça</label>
                <input
                    type="text"
                    id="raca"
                    placeholder="Ex.: sem raça definida"
                >
            </div>

            <div class="campo">
                <label for="idade">Idade em anos</label>
                <input type="number" id="idade" min="0" step="1">
            </div>

            <fieldset class="campo">
                <legend>Porte</legend>

                <input type="radio" id="pequeno"
                       name="porte" value="Pequeno" checked>
                <label for="pequeno">Pequeno</label>

                <input type="radio" id="medio"
                       name="porte" value="Médio">
                <label for="medio">Médio</label>

                <input type="radio" id="grande"
                       name="porte" value="Grande">
                <label for="grande">Grande</label>
            </fieldset>

            <div class="campo">
                <label for="cor">Cor da pelagem</label>
                <input type="text" id="cor">
            </div>

            <div class="campo">
                <label for="descricao">Sobre o pet</label>
                <textarea
                    id="descricao"
                    rows="4"
                    placeholder="Conte sobre sua personalidade e hábitos"
                ></textarea>
            </div>

            <button type="submit">Cadastrar pet</button>
        </form>

        <section id="ficha" hidden aria-live="polite">
            <h2>Ficha do pet</h2>
            <p id="dados"></p>
        </section>
    </main>

    <script>
        const formulario = document.getElementById("formulario");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();


            const nome = document.getElementById("nome").value;
            const especie = document.getElementById("especie").value;
            const raca = document.getElementById("raca").value;
            const idade = document.getElementById("idade").value;
            const cor = document.getElementById("cor").value;
            const descricao = document.getElementById("descricao").value;

            const porte = document.querySelector(
                'input[name="porte"]:checked'
            ).value;

        
            document.getElementById("dados").textContent =
                `Nome: ${nome}\n` +
                `Espécie: ${especie}\n` +
                `Raça: ${raca || "Não informada"}\n` +
                `Idade em anos: ${idade || "Não informada"}\n` +
                `Porte: ${porte}\n` +
                `Cor: ${cor || "Não informada"}\n` +
                `Sobre o pet: ${descricao || "Sem descrição"}`;

            document.getElementById("ficha").hidden = false;
        });
    </script>
</body>
</html>
